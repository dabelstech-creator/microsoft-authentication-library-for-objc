name: Railway Sandbox Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-sandbox:
    name: Create private Railway sandbox
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: 0d7fab05-2ba8-4a78-9d88-212d64f87a1f
    steps:
      - name: Validate Railway credentials and target environment
        shell: bash
        run: |
          set -eu
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Add the RAILWAY_API_TOKEN repository secret."
            exit 1
          fi
          if [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "::error::RAILWAY_ENVIRONMENT_ID is required for account/workspace tokens."
            exit 1
          fi

      - name: Create private sandbox with automatic idle cleanup
        shell: bash
        run: |
          set -eu
          railway sandbox create --private-network --idle-timeout-minutes 30 --json

      - name: Verify sandbox command execution
        shell: bash
        run: |
          set -eu
          railway sandbox exec -- bash -lc '
            set -eu
            echo "=== Railway sandbox ==="
            uname -a
            echo "=== Git ==="
            git --version
            echo "=== Node.js ==="
            node --version
            echo "=== Sandbox diagnostics passed ==="
          '

      - name: List environment sandboxes
        shell: bash
        run: |
          set -eu
          railway sandbox list --json
