# CodeQL Advanced for this repository.
#
# This repository currently has no C or C++ source files. Add c-cpp to the
# language matrix when the project contains code for the C/C++ extractor to scan.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "dabelstech-creator-patch-1" ]
  pull_request:
    branches: [ "dabelstech-creator-patch-1" ]
  schedule:
    - cron: '29 17 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none
        - language: ruby
          build-mode: none
        - language: swift
          build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'Replace this step with the manual build commands for any language configured with manual build mode.'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
