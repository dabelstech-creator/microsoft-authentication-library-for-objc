version: 2.1

jobs:
  validate-authplatform:
    docker:
      - image: swift:6.2-noble
      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authplatform_test
    resource_class: medium
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/authplatform_test?sslmode=disable
      HOST: 127.0.0.1
      PORT: "8080"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: AuthPlatform CI
      WEBAUTHN_ORIGIN: http://localhost
    steps:
      - checkout
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 30); do
              if bash -c '</dev/tcp/postgres/5432' 2>/dev/null; then
                echo "PostgreSQL is accepting connections."
                exit 0
              fi
              sleep 2
            done
            echo "PostgreSQL did not become available." >&2
            exit 1
      - run:
          name: Validate root MSAL package manifest
          command: swift package dump-package > /dev/null
      - run:
          name: Resolve AuthPlatform server dependencies
          working_directory: AuthPlatform/Server
          command: swift package resolve
      - run:
          name: Build AuthPlatform Vapor server
          working_directory: AuthPlatform/Server
          command: swift build -c release
      - run:
          name: Run AuthPlatform and PostgreSQL integration tests
          working_directory: AuthPlatform/Server
          command: swift test

workflows:
  authplatform-ci:
    jobs:
      - validate-authplatform
